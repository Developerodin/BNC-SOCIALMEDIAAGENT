client_id = "REPLACE_VIA_shopify_app_config_link"
name = "Shop Assistant"
application_url = "https://example.com"
embedded = true
# The server (EC2) and the theme app extension (Shopify CDN) live in their own folders.
web_directories = [ "server" ]
extension_directories = [ "shopify/extensions/*" ]

[access_scopes]
scopes = "read_products,read_inventory,read_orders,read_all_orders,read_publications"
use_legacy_install_flow = false

[auth]
redirect_urls = []

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = ["bulk_operations/finish"]
  uri = "/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = ["products/create", "products/update", "products/delete", "shop/update"]
  uri = "/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request","customers/redact","shop/redact"]
  uri = "/api/webhooks/shopify"
