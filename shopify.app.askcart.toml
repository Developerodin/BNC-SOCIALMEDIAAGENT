# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c80e516d95dbbe7b654945e4800a4fa0"
application_url = "https://example.com"
embedded = true
name = "AskCart"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# unauthenticated_read_customers: lets AskCart check a mobile customer's sign-in token (Storefront API). Existing installs must re-approve.
scopes = "read_products,read_inventory,read_orders,read_all_orders,read_publications,unauthenticated_read_customers"
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

# Website sign-in: the storefront calls /apps/askcart/session; Shopify signs it and adds logged_in_customer_id.
# `url` follows application_url like the entries above (shopify app dev rewrites it); the request lands on /api/proxy/session.
[app_proxy]
url = "https://example.com/api/proxy"
subpath = "askcart"
prefix = "apps"

[webhooks]
# Matches ApiVersion.October26 in src/lib/shopify/api.ts; bump both together.
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = ["bulk_operations/finish"]
  uri = "/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = ["products/create", "products/update", "products/delete", "shop/update"]
  uri = "/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request","customers/redact","shop/redact"]
  uri = "/api/webhooks/shopify"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
